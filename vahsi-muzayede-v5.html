<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vahşi Müzayede</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111318;color:#e8e8ec;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
#app{width:100%;max-width:400px;}

/* ── Temel ── */
.card{background:#1c1f28;border:1px solid #2a2d3a;border-radius:16px;padding:20px;margin-bottom:12px;}
label{display:block;font-size:12px;color:#6b7080;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #2a2d3a;background:#111318;color:#e8e8ec;font-size:15px;margin-bottom:14px;transition:border-color .15s;outline:none;}
input:focus{border-color:#4f7cff;}
button{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;}
button:disabled{opacity:.4;cursor:not-allowed;}
button:not(:disabled):hover{opacity:.88;}
.btn-primary{background:#4f7cff;color:#fff;}
.btn-secondary{background:#23262f;color:#e8e8ec;}
.btn-success{background:#1a6a3a;color:#4fd671;border:1px solid #4fd67133;}
.btn-danger{background:#6a1a1a;color:#e85f5f;border:1px solid #e85f5f33;}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;border-radius:8px;}
.hint-link{font-size:13px;color:#4f7cff;cursor:pointer;text-align:center;margin-top:12px;}
.hint-link:hover{text-decoration:underline;}

/* ── Toast ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;font-size:14px;z-index:300;max-width:90%;text-align:center;animation:slideDown .2s ease;}
.toast-err{background:#8b1a1a;border:1px solid #e85f5f44;}
.toast-ok{background:#1a4a2a;border:1px solid #4fd67144;color:#4fd671;}
@keyframes slideDown{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ── Modal overlay ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.modal-sheet{background:#1c1f28;border:1px solid #2a2d3a;border-radius:20px 20px 0 0;width:100%;max-width:400px;padding:20px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#3a3f4b;border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px;}

/* ── Menü header ── */
.menu-header{background:linear-gradient(160deg,#1a2040 0%,#1c1f28 100%);border:1px solid #2a2d3a;border-radius:16px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;}
.menu-header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#4f7cff18,transparent 70%);}
.user-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.user-info{display:flex;align-items:center;gap:10px;}
.avatar{width:42px;height:42px;border-radius:12px;background:#4f7cff22;border:2px solid #4f7cff44;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;}
.notif-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;background:#e85f5f;border-radius:50%;border:2px solid #1c1f28;}
.username{font-size:15px;font-weight:700;}
.user-level{font-size:12px;color:#6b7080;}
.header-actions{display:flex;gap:8px;}
.icon-btn{width:34px;height:34px;border-radius:9px;background:#23262f;border:1px solid #2a2d3a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s;position:relative;}
.icon-btn:hover{background:#2a2d3a;}
.icon-badge{position:absolute;top:-4px;right:-4px;background:#e85f5f;color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;}
.xp-row{display:flex;justify-content:space-between;font-size:12px;color:#6b7080;margin-bottom:6px;}
.xp-bar{height:6px;background:#23262f;border-radius:4px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,#4f7cff,#7c9fff);border-radius:4px;transition:width .6s ease;}
.animals-row{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;font-size:32px;}
.game-title{text-align:center;}
.game-title h1{font-size:24px;font-weight:900;letter-spacing:1px;}
.game-title p{font-size:12px;color:#6b7080;margin-top:4px;}

/* ── Menü butonları ── */
.menu-btn{display:flex;align-items:center;gap:12px;background:#1c1f28;border:1px solid #2a2d3a;border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;width:100%;text-align:left;}
.menu-btn:hover{background:#23262f;border-color:#3a3f50;}
.menu-btn-icon{font-size:24px;width:32px;text-align:center;}
.menu-btn-text{flex:1;}
.menu-btn-title{font-size:14px;font-weight:700;}
.menu-btn-sub{font-size:12px;color:#6b7080;margin-top:2px;}
.menu-btn-arrow{color:#3a3f50;font-size:18px;}
.menu-btn.primary{background:#1a2040;border-color:#4f7cff44;}
.menu-btn.primary:hover{border-color:#4f7cff88;background:#1e2648;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.grid-btn{background:#1c1f28;border:1px solid #2a2d3a;border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;width:100%;border:1px solid #2a2d3a;}
.grid-btn:hover{background:#23262f;border-color:#3a3f50;}
.grid-btn-icon{font-size:26px;margin-bottom:6px;}
.grid-btn-title{font-size:13px;font-weight:700;}
.grid-btn-sub{font-size:11px;color:#6b7080;margin-top:2px;}
.stats-row{display:flex;gap:8px;margin-bottom:10px;}
.stat-card{flex:1;background:#1c1f28;border:1px solid #2a2d3a;border-radius:12px;padding:10px;text-align:center;}
.stat-val{font-size:18px;font-weight:800;}
.stat-lbl{font-size:10px;color:#6b7080;margin-top:2px;}

/* ── Tab bar ── */
.tab-bar{display:flex;background:#1c1f28;border:1px solid #2a2d3a;border-radius:14px;padding:5px;gap:3px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;cursor:pointer;font-size:10px;color:#6b7080;border:none;background:none;transition:background .15s,color .15s;position:relative;}
.tab-item.active{background:#23262f;color:#e8e8ec;}
.tab-item:hover:not(.active){color:#a0a5b1;}
.tab-icon{font-size:18px;}
.tab-badge{position:absolute;top:4px;right:calc(50% - 16px);background:#e85f5f;color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;}

/* ── Arkadaşlar ekranı ── */
.screen-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.back-btn{width:32px;height:32px;border-radius:9px;background:#23262f;border:1px solid #2a2d3a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;}
.screen-title{font-size:17px;font-weight:700;flex:1;}
.search-box{display:flex;gap:8px;margin-bottom:16px;}
.search-box input{margin-bottom:0;flex:1;}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:#6b7080;text-transform:uppercase;margin:14px 0 8px;padding:0 2px;}

/* Arkadaş satırı */
.friend-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a2d3a22;}
.friend-row:last-child{border-bottom:none;}
.friend-avatar{width:36px;height:36px;border-radius:10px;background:#23262f;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.friend-info{flex:1;min-width:0;}
.friend-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.friend-meta{font-size:12px;color:#6b7080;margin-top:1px;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
.sd-online{background:#4fd671;} .sd-ingame{background:#e8c14f;} .sd-offline{background:#3a3f4b;}
.friend-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── Profil kartı ── */
.profile-card-header{text-align:center;padding:8px 0 20px;}
.profile-big-avatar{font-size:56px;margin-bottom:8px;}
.profile-name{font-size:22px;font-weight:800;margin-bottom:2px;}
.profile-level{font-size:13px;color:#6b7080;margin-bottom:16px;}
.profile-stats{display:flex;gap:8px;margin-bottom:16px;}
.profile-stat{flex:1;text-align:center;background:#111318;border-radius:10px;padding:10px 6px;}
.ps-val{font-size:18px;font-weight:800;}
.ps-lbl{font-size:10px;color:#6b7080;margin-top:2px;}
.profile-mmr{text-align:center;font-size:13px;color:#6b7080;margin-bottom:16px;}
.profile-fav{text-align:center;font-size:13px;color:#6b7080;margin-bottom:16px;}

/* ── Match history ── */
.match-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #2a2d3a22;}
.match-row:last-child{border-bottom:none;}
.match-opponent{flex:1;font-size:14px;font-weight:600;}
.match-score{font-size:14px;font-weight:700;color:#a0a5b1;}
.match-result{font-size:14px;margin-left:4px;}
.match-time{font-size:11px;color:#6b7080;}

/* ── Lobi ekranı ── */
.lobby-code-box{background:#111318;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;}
.lobby-code{font-family:monospace;font-size:32px;font-weight:900;letter-spacing:6px;color:#4f7cff;margin-bottom:8px;}
.lobby-hint{font-size:12px;color:#6b7080;}
.lobby-players{display:flex;gap:8px;margin-bottom:14px;}
.lobby-player{flex:1;background:#111318;border-radius:10px;padding:12px;text-align:center;border:2px solid #2a2d3a;transition:border-color .3s;}
.lobby-player.ready{border-color:#4fd671;}
.lp-icon{font-size:28px;margin-bottom:4px;}
.lp-name{font-size:13px;font-weight:600;}
.lp-status{font-size:11px;color:#6b7080;margin-top:3px;}
.lobby-player.ready .lp-status{color:#4fd671;}

/* ── Oyun state ekranları ── */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#4fd671;} .dot-yellow{background:#e8c14f;} .dot-red{background:#e85f5f;}
.dot-pulse{animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b7080;margin-bottom:10px;}
.player-badges{display:flex;gap:8px;margin-bottom:12px;}
.p-badge{flex:1;background:#111318;border-radius:10px;padding:10px 12px;border:2px solid transparent;}
.p-badge.active{border-color:#4f7cff;}
.p-badge.me{background:#151b30;}
.p-name{font-size:12px;color:#6b7080;margin-bottom:2px;}
.p-bal{font-size:18px;font-weight:700;}
.animal-big{text-align:center;padding:16px 0;}
.a-emoji{font-size:60px;line-height:1;margin-bottom:8px;}
.a-name{font-size:17px;font-weight:700;margin-bottom:4px;}
.a-meta{font-size:12px;color:#6b7080;}
.rarity-badge{display:inline-block;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;margin-top:6px;}
.bid-box{text-align:center;margin-bottom:12px;}
.bid-amt{font-size:22px;font-weight:700;margin-bottom:4px;}
.bid-who{font-size:12px;color:#6b7080;}
.turn-box{text-align:center;padding:8px;background:#111318;border-radius:8px;margin-bottom:12px;font-size:14px;}
.bid-row{display:flex;gap:8px;margin-bottom:8px;}
.bid-row input{margin-bottom:0;flex:1;}
.bid-row button{width:auto;flex:0 0 100px;}
.observer{text-align:center;font-size:13px;color:#6b7080;margin-top:8px;}
.battle-vs{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 0;}
.b-side{text-align:center;flex:1;}
.b-emoji{font-size:48px;}
.b-power{font-size:22px;font-weight:800;margin-top:6px;}
.b-vs{font-size:13px;color:#6b7080;font-weight:700;}
.winner-glow{color:#4fd671;}
.score-line{text-align:center;font-size:13px;color:#6b7080;margin-bottom:8px;}
.final-score{font-size:44px;font-weight:900;text-align:center;margin:8px 0;}
.final-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:14px;}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:8px;}
.coll-item{text-align:center;background:#111318;border-radius:8px;padding:8px 4px;font-size:11px;}
.reconnect-bar{background:#1e1a10;border:1px solid #e8c14f33;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px;font-size:14px;}
.ready-row{display:flex;gap:8px;margin-bottom:10px;}
.ready-item{flex:1;text-align:center;background:#111318;border-radius:10px;padding:10px 6px;font-size:12px;}
.ready-item.done{background:#1a4a2a;color:#4fd671;border:1px solid #4fd67133;}
.countdown-wrap{margin-top:10px;}
.countdown-label{font-size:12px;color:#6b7080;text-align:center;margin-bottom:4px;}
.countdown-bar{height:4px;background:#23262f;border-radius:4px;overflow:hidden;}
.countdown-fill{height:100%;background:#4f7cff;border-radius:4px;transition:width .25s linear;}

/* ── Rövanş butonu ── */
.rematch-btn{background:linear-gradient(135deg,#6a1a1a,#8b2020);border:1px solid #e85f5f44;color:#e85f5f;font-size:16px;padding:14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.rematch-btn:hover:not(:disabled){opacity:.9;border-color:#e85f5f88;}

/* ── Bildirimler ── */
.notif-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a2d3a22;}
.notif-row:last-child{border-bottom:none;}
.notif-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.notif-text{flex:1;font-size:13px;}
.notif-time{font-size:11px;color:#6b7080;margin-top:2px;}
.notif-actions{display:flex;gap:6px;}

/* ── Bildirim Dropdown Paneli ── */
.notif-panel-overlay{position:fixed;inset:0;z-index:150;background:transparent;}
.notif-panel{
  position:fixed;top:0;right:0;
  width:min(340px, 100vw);
  max-height:80vh;
  background:#1c1f28;
  border-left:1px solid #2a2d3a;
  border-bottom:1px solid #2a2d3a;
  border-radius:0 0 0 16px;
  box-shadow:-4px 4px 24px rgba(0,0,0,.5);
  z-index:151;
  display:flex;flex-direction:column;
  animation:slideInRight .2s ease;
}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.notif-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  border-bottom:1px solid #2a2d3a;
  flex-shrink:0;
}
.notif-panel-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;}
.notif-panel-close{
  width:28px;height:28px;border-radius:8px;background:#23262f;
  border:1px solid #2a2d3a;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.notif-panel-close:hover{background:#2a2d3a;}
.notif-panel-body{overflow-y:auto;padding:6px 12px;flex:1;}
.notif-panel-empty{text-align:center;color:#6b7080;font-size:13px;padding:24px 0;}
.np-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #2a2d3a22;}
.np-row:last-child{border-bottom:none;}
.np-row.unread{background:#1a2040;border-radius:8px;padding:10px 8px;margin:2px 0;}
.np-icon{font-size:20px;width:30px;text-align:center;flex-shrink:0;margin-top:1px;}
.np-body{flex:1;min-width:0;}
.np-text{font-size:13px;line-height:1.4;}
.np-time{font-size:11px;color:#6b7080;margin-top:2px;}
.np-acts{display:flex;gap:6px;margin-top:6px;}

/* ── Düello davet bekleme ── */
.duel-wait-screen{text-align:center;padding:8px 0;}
.duel-wait-avatar{font-size:48px;margin-bottom:8px;}
.duel-wait-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.duel-wait-sub{font-size:13px;color:#6b7080;margin-bottom:20px;}
.duel-wait-bar{height:4px;background:#23262f;border-radius:4px;overflow:hidden;margin-bottom:6px;}
.duel-wait-fill{height:100%;background:#4f7cff;border-radius:4px;transition:width 1s linear;}
.duel-wait-timer{font-size:12px;color:#6b7080;margin-bottom:16px;}

/* ── Geri sayım ── */
.countdown-screen{
  position:fixed;inset:0;background:#111318;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;
}
.countdown-number{
  font-size:120px;font-weight:900;color:#4f7cff;
  animation:countPop .8s ease;
  line-height:1;
}
@keyframes countPop{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.countdown-label{font-size:18px;color:#6b7080;margin-top:16px;}
.countdown-go{font-size:48px;font-weight:900;color:#4fd671;animation:countPop .5s ease;}

/* ── Lobi VS ekranı ── */
.lobby-vs-wrap{display:flex;align-items:center;justify-content:center;gap:0;margin:16px 0;}
.lobby-vs-side{flex:1;text-align:center;padding:16px 8px;}
.lvs-avatar{font-size:40px;margin-bottom:6px;}
.lvs-name{font-size:16px;font-weight:800;margin-bottom:2px;}
.lvs-level{font-size:12px;color:#6b7080;margin-bottom:8px;}
.lvs-ready{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;}
.lvs-ready.yes{background:#1a4a2a;color:#4fd671;}
.lvs-ready.no{background:#23262f;color:#6b7080;}
.lobby-vs-divider{font-size:22px;font-weight:900;color:#4f7cff;padding:0 8px;flex-shrink:0;}

/* ── Onay modal ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-box{background:#1c1f28;border:1px solid #2a2d3a;border-radius:16px;padding:24px;width:100%;max-width:340px;text-align:center;}
.confirm-title{font-size:17px;font-weight:800;margin-bottom:8px;}
.confirm-sub{font-size:13px;color:#6b7080;margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// =========================================================
//  Vahşi Müzayede — Client v5
//  Arkadaşlar, profil kartı, son oynanlar, rövanş, lobi
// =========================================================

const SUPABASE_URL  = 'https://fwyfsqtncggcdkjxoudr.supabase.co';
const SUPABASE_ANON = 'sb_publishable_NYK4wR077xmh88tcOf38jg_Y05HQQ0Z';
const DEFAULT_WS    = 'wss://vahsi-muzayede-server-production.up.railway.app';
const XP_WIN = 100, XP_LOSE = 30, MMR_K = 32;
const RARITY_COLORS = {common:'#93A69C',uncommon:'#8FBF4F',rare:'#4FA0E8',epic:'#B07BE8',legendary:'#E8B23D'};

// ── Supabase API ──────────────────────────────────────────
const sb = {
  h(token){return{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':`Bearer ${token}`};},
  async post(path,body,token){const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:this.h(token),body:JSON.stringify(body)});return r.json();},
  async get(path,token){const r=await fetch(SUPABASE_URL+path,{headers:this.h(token)});return r.json();},
  async patch(path,body,token){await fetch(SUPABASE_URL+path,{method:'PATCH',headers:{...this.h(token),'Prefer':'return=minimal'},body:JSON.stringify(body)});},
  async insert(path,body,token){const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{...this.h(token),'Prefer':'return=representation'},body:JSON.stringify(body)});return r.json();},

  async signUp(email,pass,uname){return this.post('/auth/v1/signup',{email,password:pass,options:{data:{username:uname}}},SUPABASE_ANON);},
  async signIn(email,pass){return this.post('/auth/v1/token?grant_type=password',{email,password:pass},SUPABASE_ANON);},
  async signOut(token){await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${token}`}});},

  async getProfile(token,uid){
    // uid verilmezse token sahibinin id'sini kullan — asla limit=1 ile rastgele satır çekme
    const targetId = uid || authUser?.id;
    if(!targetId) return null;
    const d = await this.get(`/rest/v1/profiles?id=eq.${targetId}&limit=1`,token);
    return Array.isArray(d)?d[0]:null;
  },
  async searchProfiles(token,query){
    const d=await this.get(`/rest/v1/profiles?username=ilike.*${encodeURIComponent(query)}*&select=id,username,level,mmr,wins,losses&limit=10`,token);
    return Array.isArray(d)?d:[];
  },

  // Arkadaşlık
  async getFriends(token){
    const d=await this.get('/rest/v1/friendships?or=(requester.eq.'+authUser.id+',addressee.eq.'+authUser.id+')&select=*',token);
    return Array.isArray(d)?d:[];
  },
  async sendFriendRequest(token,addresseeId){
    return this.insert('/rest/v1/friendships',{requester:authUser.id,addressee:addresseeId},token);
  },
  // ── Duel Invites ──────────────────────────────
  async createDuelInvite(token, receiverId){
    const rows = await this.insert('/rest/v1/duel_invites',{
      sender_id: authUser.id,
      receiver_id: receiverId,
    }, token);
    const inv = Array.isArray(rows)?rows[0]:null;
    if(!inv?.id){
      console.error('Duel invite oluşturulamadı:', rows);
      return null;
    }
    // Bildirim artık SECURITY DEFINER RPC üzerinden atılıyor, çünkü
    // client'tan doğrudan başka birinin notifications satırına yazmak
    // RLS tarafından sessizce reddediliyordu.
    const notifRes = await fetch(SUPABASE_URL+'/rest/v1/rpc/notify_user', {
      method: 'POST',
      headers: this.h(token),
      body: JSON.stringify({
        target:  receiverId,
        ntype:   'duel',
        ndata:   { inviteId: inv.id },
        related: inv.id,
      }),
    });
    if(!notifRes.ok){
      const err = await notifRes.json().catch(()=>({}));
      console.error('Düello bildirimi gönderilemedi:', err);
    }
    return inv;
  },
  async getDuelInvite(token, inviteId){
    const d = await this.get('/rest/v1/duel_invites?id=eq.'+inviteId+'&limit=1', token);
    return Array.isArray(d)?d[0]:null;
  },
  async updateDuelInvite(token, inviteId, patch){
    await this.patch('/rest/v1/duel_invites?id=eq.'+inviteId, patch, token);
  },
  // Legacy — kullanılmıyor
  async sendDuelInvite(token,targetId,lobbyCode){
    return this.insert('/rest/v1/notifications',{user_id:targetId,type:'duel',from_id:authUser.id,data:JSON.stringify({lobbyCode}),read:false},token);
  },
  async acceptFriend(token,friendshipId){
    await this.patch('/rest/v1/friendships?id=eq.'+friendshipId,{status:'accepted'},token);
  },
  async rejectFriend(token,friendshipId){
    await fetch(SUPABASE_URL+'/rest/v1/friendships?id=eq.'+friendshipId,{method:'DELETE',headers:this.h(token)});
  },

  // Bildirimler
  async getNotifications(token){
    const d=await this.get('/rest/v1/notifications?user_id=eq.'+authUser.id+'&order=created_at.desc&limit=30&select=*,from:from_id(id,username,level)',token);
    return Array.isArray(d)?d:[];
  },
  async markNotifRead(token,id){await this.patch('/rest/v1/notifications?id=eq.'+id,{read:true},token);},
  async markAllNotifsRead(token){await this.patch('/rest/v1/notifications?user_id=eq.'+authUser.id+'&read=eq.false',{read:true},token);},

  // Maç geçmişi
  async getMatchHistory(token,userId,limit=10){
    const id=userId||authUser.id;
    const d=await this.get(`/rest/v1/match_history?or=(player1_id.eq.${id},player2_id.eq.${id})&order=played_at.desc&limit=${limit}&select=*`,token);
    return Array.isArray(d)?d:[];
  },
  async saveMatch(token,match){
    return this.insert('/rest/v1/match_history',match,token);
  },

  // İstatistik güncelle
  async updateStats(token,userId,won,myMmr,opponentMmr){
    const xpGain=won?XP_WIN:XP_LOSE;
    const p=await this.getProfile(token);
    if(!p)return null;
    const mmrChange=calcMmrChange(won,myMmr||1000,opponentMmr||1000);
    const newXp=p.xp+xpGain;
    const newWins=p.wins+(won?1:0);
    const newLosses=p.losses+(won?0:1);
    const newLevel=Math.max(1,Math.floor(newXp/500)+1);
    const newMmr=Math.max(0,(p.mmr||1000)+mmrChange);
    await this.patch('/rest/v1/profiles?id=eq.'+userId,{xp:newXp,wins:newWins,losses:newLosses,level:newLevel,mmr:newMmr},token);
    return{xpGain,mmrChange,newXp,newLevel,newMmr};
  },
};

function calcMmrChange(won,myMmr,oppMmr){
  const expected=1/(1+Math.pow(10,(oppMmr-myMmr)/400));
  const actual=won?1:0;
  return Math.round(MMR_K*(actual-expected));
}

function renderAuth(){
  const isReg=authMode==='register';
  const wrap=el(`

        ${isReg?`<label>Kullanıcı adı</label><input id="in-uname" placeholder="lokman42" maxlength="20">`:''}

      </div>
    </div>
  `);
  app.appendChild(wrap);
  wrap.querySelector('#toggle').addEventListener('click',()=>{authMode=isReg?'login':'register';render();});
  wrap.querySelector('#btn-submit').addEventListener('click',async()=>{
    const btn=wrap.querySelector('#btn-submit');
    const email=wrap.querySelector('#in-email').value.trim();
    const pass=wrap.querySelector('#in-pass').value;
    const uname=isReg?wrap.querySelector('#in-uname')?.value.trim():null;
    if(!email||!pass){showErr('E-posta ve şifre zorunlu.');return;}
    if(isReg&&!uname){showErr('Kullanıcı adı zorunlu.');return;}
    if(pass.length<6){showErr('Şifre en az 6 karakter.');return;}
    btn.disabled=true;btn.textContent='…';
    try{
      if(isReg){
        // KAYIT: sadece hesap oluştur, giriş ekranına yönlendir
        const data=await sb.signUp(email,pass,uname);
        if(data?.error){showErr(friendlyErr(data.error.message));return;}
        showToast('Hesap oluşturuldu! Şimdi giriş yapabilirsin.',true);
        authMode='login';
        // E-postayı giriş ekranına taşı
        setTimeout(()=>{
          const emailEl=document.querySelector('#in-email');
          if(emailEl)emailEl.value=email;
        },50);
        render();
      } else {
        // GİRİŞ
        const data=await sb.signIn(email,pass);
        if(data?.error){showErr(friendlyErr(data.error.message));return;}
        authToken=data.access_token;
        localStorage.setItem('vm_token',authToken);
        try{
          const parts=authToken.split('.');
          const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
          authUser={id:payload.sub,email:payload.email};
        }catch{}
        await loadProfile();
      }
    }finally{btn.disabled=false;}
  });
  wrap.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')wrap.querySelector('#btn-submit').click();}));
}

    wrap.appendChild(friendCard);
  }

  app.appendChild(wrap);
}

// Davet gönder + bekleme ekranı göster
async function sendDuelAndWait(targetId, targetName){
  // Güvenlik: kendine davet gönderilemez
  if(targetId===authUser.id){
    showToast('Kendine düello daveti gönderemezsin.',false);
    return;
  }
  // Önceki aktif daveti iptal et
  if(activeDuelInvite){
    await sb.updateDuelInvite(authToken, activeDuelInvite.id, {status:'cancelled'});
    clearTimeout(duelWaitTimer);
  }

  const invite = await sb.createDuelInvite(authToken, targetId);
  if(!invite){showToast('Davet gönderilemedi.',false);return;}

  activeDuelInvite = {
    id: invite.id,
    receiverName: targetName,
    expiresAt: new Date(invite.expires_at).getTime(),
  };

  // 60sn expire timer
  clearTimeout(duelWaitTimer);
  duelWaitTimer = setTimeout(async()=>{
    if(activeDuelInvite?.id===invite.id){
      activeDuelInvite=null;
      showToast('Düello davetinin süresi doldu.',false);
      subScreen=null; render();
    }
  }, 60000);

  // Bekleme ekranını göster
  subScreen='duel-wait';
  render();
}

// Bekleme ekranı render'ı
function renderDuelWait(){
  if(!activeDuelInvite){subScreen=null;render();return;}
  const wrap=el(`<div></div>`);
  const hdr=el(`<div class="screen-header"><div class="back-btn" id="back">‹</div><div class="screen-title">Düello Daveti</div></div>`);
  hdr.querySelector('#back').addEventListener('click',()=>{subScreen=null;render();});
  wrap.appendChild(hdr);

  const secLeft=Math.max(0,Math.ceil((activeDuelInvite.expiresAt-Date.now())/1000));
  const pct=Math.round((secLeft/60)*100);

  const card=el(`
    <div class="card duel-wait-screen">
      <div class="duel-wait-avatar">⚔️</div>
      <div class="duel-wait-title">Davet Gönderildi!</div>
      <div class="duel-wait-sub">${esc(activeDuelInvite.receiverName)}'e meydan okudun.<br>Onay bekleniyor…</div>
      <div class="duel-wait-bar"><div class="duel-wait-fill" id="dw-fill" style="width:${pct}%"></div></div>
      <div class="duel-wait-timer" id="dw-timer">${secLeft} saniye</div>
    </div>
  `);
  wrap.appendChild(card);

  const cancelBtn=el(`<button class="btn-danger" id="btn-cancel-duel">❌ Daveti İptal Et</button>`);
  cancelBtn.addEventListener('click',async()=>{
    if(activeDuelInvite){
      await sb.updateDuelInvite(authToken,activeDuelInvite.id,{status:'cancelled'});
      activeDuelInvite=null;
      clearTimeout(duelWaitTimer);
    }
    subScreen=null; render();
  });
  wrap.appendChild(cancelBtn);
  app.appendChild(wrap);

  // Countdown tick
  clearInterval(duelCountdown);
  duelCountdown=setInterval(()=>{
    const s=Math.max(0,Math.ceil((activeDuelInvite?.expiresAt-Date.now())/1000));
    const f=document.querySelector('#dw-fill');
    const t=document.querySelector('#dw-timer');
    if(f)f.style.width=Math.round((s/60)*100)+'%';
    if(t)t.textContent=s+' saniye';
    if(s<=0){clearInterval(duelCountdown);}
  },1000);
}

let notifPanelOpen = false;
let cachedNotifs   = [];
let seenNotifIds   = new Set();   // Toast spam'i önlemek için: hangi bildirimleri zaten gösterdik

function toggleNotifPanel(){
  if(notifPanelOpen){ closeNotifPanel(); return; }

// Bildirim rozetini tam render() tetiklemeden, DOM üzerinde canlı günceller.

// Bildirimleri periyodik çeker; paneli açık değilse bile rozeti
// otomatik günceller ve yeni gelen bildirim için toast gösterir.
async function pollNotifications(){
  if(!authToken||!authUser)return;
  try{
    const notifs=await sb.getNotifications(authToken);
    const freshOnes=notifs.filter(n=>!n.read&&!seenNotifIds.has(n.id));
    cachedNotifs=notifs;
    unreadCount=notifs.filter(n=>!n.read).length;
    seenNotifIds=new Set(notifs.map(n=>n.id));

    updateNotifBadgeDom();
    if(notifPanelOpen)renderNotifPanel();

    for(const n of freshOnes){
      if(n.type==='duel'){
        showToast(`🗡️ ${esc(n.from?.username||'Biri')} seni düelloya davet etti!`,true);
      } else if(n.type==='friend_request'){
        showToast(`👥 ${esc(n.from?.username||'Biri')} arkadaşlık isteği gönderdi`,true);
      } else if(n.type==='friend_accepted'){
        showToast(`✅ ${esc(n.from?.username||'Biri')} arkadaşlığını kabul etti`,true);
      } else if(n.type==='duel_declined'){
        showToast('Düello daveti reddedildi.',false);
      }
    }
  }catch(e){ /* sessiz geç — bir sonraki pollde tekrar denenecek */ }
}

function closeNotifPanel(){
  notifPanelOpen=false;
  document.querySelector('.notif-panel-overlay')?.remove();
  document.querySelector('.notif-panel')?.remove();
}

async function openNotifPanel(){
  notifPanelOpen=true;
  // Arka planda çek
  try{
    cachedNotifs=await sb.getNotifications(authToken);
    // Okunmayanları okundu yap
    const unread=cachedNotifs.filter(n=>!n.read);
    if(unread.length){
      await sb.markAllNotifsRead(authToken);
      unreadCount=0;
      // Rozeti güncelle
      const badge=document.querySelector('.icon-badge');
      if(badge)badge.remove();
      const dot=document.querySelector('.notif-dot');
      if(dot)dot.remove();
    }
  }catch(e){ cachedNotifs=[]; }
  renderNotifPanel();
}

function renderNotifPanel(){
  // Var olanı kaldır
  closeNotifPanel();
  notifPanelOpen=true;

  // Tıklama arkası kapat
  const overlay=document.createElement('div');
  overlay.className='notif-panel-overlay';
  overlay.addEventListener('click', closeNotifPanel);

  const panel=document.createElement('div');
  panel.className='notif-panel';

  // Başlık
  const head=document.createElement('div');
  head.className='notif-panel-head';
  head.innerHTML=`
    <div class="notif-panel-title">🔔 Bildirimler${unreadCount>0?` <span style="background:#e85f5f;color:#fff;font-size:10px;border-radius:6px;padding:1px 5px">${unreadCount}</span>`:''}
    </div>
    <div class="notif-panel-close" id="np-close">✕</div>
  `;
  head.querySelector('#np-close').addEventListener('click',closeNotifPanel);
  panel.appendChild(head);

  // Gövde
  const body=document.createElement('div');
  body.className='notif-panel-body';

  if(!cachedNotifs.length){
    body.innerHTML=`<div class="notif-panel-empty">Bildirim yok</div>`;
  } else {
    cachedNotifs.forEach(n=>{
      const row=document.createElement('div');
      row.className='np-row'+(n.read?'':' unread');

      let icon='🔔', text='';
      if(n.type==='friend_request'){
        icon='👥';
        text=`<strong>${esc(n.from?.username||'?')}</strong> sana arkadaşlık isteği gönderdi`;
      } else if(n.type==='friend_accepted'){
        icon='✅';
        text=`<strong>${esc(n.from?.username||'?')}</strong> arkadaşlık isteğini kabul etti`;
      } else if(n.type==='rematch'){
        icon='⚔️';
        text=`<strong>${esc(n.from?.username||'?')}</strong> sana meydan okudu`;
      } else if(n.type==='duel'){
        icon='🗡️';
        text=`<strong>${esc(n.from?.username||'?')}</strong> seni düelloya davet etti`;
      }

      // inviteId: JSON parse et (data string veya obje olabilir)
      let parsedData={};
      try{ parsedData=typeof n.data==='string'?JSON.parse(n.data):n.data||{}; }catch{}
      const inviteId=n.related_id||parsedData.inviteId||null;

      const acts = n.type==='friend_request' ? `
        <div class="np-acts">
          <button class="btn-success btn-sm" data-fid="${n.id}" data-rid="${n.from_id}" data-action="accept">✓ Kabul Et</button>
          <button class="btn-danger btn-sm"  data-fid="${n.id}" data-action="reject">✗ Reddet</button>
        </div>` : n.type==='duel'&&inviteId ? `
        <div class="np-acts">
          <button class="btn-success btn-sm" data-invite="${inviteId}" data-action="duel-accept">⚔️ Kabul Et</button>
          <button class="btn-danger btn-sm"  data-invite="${inviteId}" data-action="duel-reject">Reddet</button>
        </div>` : n.type==='duel_declined' ? `
        <div style="font-size:12px;color:#e85f5f;margin-top:4px">Düello reddedildi.</div>` : '';

      row.innerHTML=`
        <div class="np-icon">${icon}</div>
        <div class="np-body">
          <div class="np-text">${text}</div>
          <div class="np-time">${relativeTime(n.created_at)}</div>
          ${acts}
        </div>
      `;

      // Kabul/reddet eventleri
      row.querySelector('[data-action="accept"]')?.addEventListener('click',async(e)=>{
        const requesterId=e.target.dataset.rid;
        const fr=friends.find(f=>f.requester===requesterId&&f.addressee===authUser.id);
        if(fr){ await sb.acceptFriend(authToken,fr.id); friends=await sb.getFriends(authToken); }
        showToast('Arkadaş eklendi!',true);
        closeNotifPanel();
      });
      row.querySelector('[data-action="reject"]')?.addEventListener('click',async(e)=>{
        const requesterId=e.target.dataset.rid;
        const fr=friends.find(f=>f.requester===requesterId&&f.addressee===authUser.id);
        if(fr){ await sb.rejectFriend(authToken,fr.id); friends=await sb.getFriends(authToken); }
        closeNotifPanel();
      });
      // Düello kabul/reddet
      row.querySelector('[data-action="duel-accept"]')?.addEventListener('click',async(e)=>{
        const inviteId=e.target.dataset.invite;
        closeNotifPanel();
        await acceptDuelInvite(inviteId);
      });
      row.querySelector('[data-action="duel-reject"]')?.addEventListener('click',async(e)=>{
        const inviteId=e.target.dataset.invite;
        await sb.updateDuelInvite(authToken, inviteId, {status:'declined'});
        // Gönderene bildirim — RPC üzerinden (bkz. notify_user, RLS by-pass)
        const inv=await sb.getDuelInvite(authToken, inviteId);
        if(inv){
          const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/notify_user',{
            method:'POST', headers: sb.h(authToken),
            body: JSON.stringify({ target: inv.sender_id, ntype: 'duel_declined', ndata: {}, related: inv.id }),
          });
          if(!r.ok) console.error('Red bildirimi gönderilemedi:', await r.json().catch(()=>({})));
        }
        closeNotifPanel();
        showToast('Düello reddedildi.',false);
      });

      body.appendChild(row);
    });
  }

  panel.appendChild(body);
  document.body.appendChild(overlay);
  document.body.appendChild(panel);
}

// Düello davetini kabul et → lobi oluştur → her ikisini gönder
async function acceptDuelInvite(inviteId){
  // Daveti getir
  const invite = await sb.getDuelInvite(authToken, inviteId);
  if(!invite){ showToast('Davet bulunamadı.',false); return; }
  if(invite.status !== 'pending'){ showToast('Bu davet artık geçerli değil.',false); return; }
  if(new Date(invite.expires_at) < new Date()){ showToast('Davet süresi dolmuş.',false); return; }

  // Daveti kabul et
  await sb.updateDuelInvite(authToken, inviteId, {status:'accepted'});

  // Gönderene bildirim: davet kabul edildi + lobi kodu gelecek
  // Lobi kodu WS bağlantısı kurulunca gönderilecek
  activeDuelInvite=null;
  clearTimeout(duelWaitTimer);

  // Daveti gönderen kişiye lobi kodunu ilet: yeni oda kurulunca
  // ORİJİNAL davetin lobby_code alanını güncelleyeceğiz (yeni davet DEĞİL).
  acceptedInviteId = invite.id;
  subScreen='lobby'; lobbyMode='waiting';
  startLobby(null);  // yeni lobi aç
}

// 3-2-1 geri sayım → maç başlat
function startCountdownSequence(){
  let count=3;
  showCountdownScreen(count);
  const timer=setInterval(()=>{
    count--;
    if(count>0){
      showCountdownScreen(count);
    } else {
      clearInterval(timer);
      showCountdownScreen('GO');
      setTimeout(()=>{
        sendAction('START_PRIVATE_GAME');
      },700);
    }
  },1000);
}

function showCountdownScreen(val){
  document.querySelector('.countdown-screen')?.remove();
  const screen=document.createElement('div');
  screen.className='countdown-screen';
  if(val==='GO'){
    screen.innerHTML=`<div class="countdown-go">🗡️ SAVAŞ BAŞLIYOR!</div>`;
  } else {
    screen.innerHTML=`
      <div class="countdown-number">${val}</div>
      <div class="countdown-label">Hazır ol…</div>
    `;
  }
  document.body.appendChild(screen);
  setTimeout(()=>screen.remove(),900);
}

function startLobby(existingCode){
  lobbyPlayers={};
  lobbyCode=existingCode; // lobi ekranında göstermek için
  startGame(existingCode);
}

function checkLobbyReady(){
  const p1r=lobbyPlayers['player1']?.ready;
  const p2r=lobbyPlayers['player2']?.ready;
  if(p1r&&p2r&&isHost()){
    sendAction('START_GAME_FROM_LOBBY');// sunucu zaten başlatıyor iki oyuncu bağlanınca
  }
}

// ── Oyun Ekranı ───────────────────────────────────────────
function isHost(){return myPlayerId==='player1';}

function renderGame(){
  // Forfeit sonucu
  if(forfeitResult){
    const iWon=forfeitResult.winnerId===myPlayerId;
    const card=el(`
      <div class="card" style="text-align:center">
        <div style="font-size:48px;margin-bottom:8px">${iWon?'🏆':'💀'}</div>
        <div style="font-size:22px;font-weight:800;margin-bottom:8px">
          ${iWon?'Kazandın!':'Kaybettin.'}
        </div>
        <div style="font-size:14px;color:#6b7080;margin-bottom:16px">
          ${iWon?'Rakip bağlantısı kesildi ve geri dönmedi.':'Bağlantın kesildi ve 20 saniyede geri dönemedin.'}
        </div>
      </div>
    `);
    app.appendChild(card);
    app.appendChild(backMenuBtn('Ana Menüye Dön'));
    return;
  }

  if(connStatus==='disconnected'&&currentState){
    app.appendChild(el(`
      <div class="reconnect-bar"><strong style="color:#e8c14f">Bağlantı kesildi.</strong> 20 sn içinde geri dön!<br>
      <button class="btn-primary btn-sm" id="btn-rc" style="margin-top:8px">Yeniden Bağlan</button></div>
    `));
    app.querySelector('#btn-rc').addEventListener('click',()=>{reconnectAttempts=0;connectWs(myGameId);});
  }

  if(!currentState){
    app.appendChild(el(`<div class="card" style="text-align:center;padding:28px">${connStatus==='reconnecting'?`Bağlanılıyor… (${reconnectAttempts}/${MAX_RECONNECT})`:'Bağlanılıyor…'}</div>`));
    app.appendChild(backMenuBtn());
    return;
  }

  let dot='dot-green',stxt='Bağlı';
  if(connStatus==='opponent_gone'){dot='dot-yellow dot-pulse';stxt='Rakip bağlantısı koptu…';}
  if(connStatus==='disconnected'){dot='dot-red';stxt='Bağlantı kesildi';}
  if(connStatus==='reconnecting'){dot='dot-yellow dot-pulse';stxt='Yeniden bağlanılıyor…';}
  app.appendChild(el(`
    <div class="status-bar">
      <span><span class="dot ${dot}"></span>${stxt}</span>
      <span>${esc(currentState.players[myPlayerId]?.name||'?')}</span>
    </div>
  `));

  const badges=el(`<div class="player-badges"></div>`);
  for(const pid of['player1','player2']){
    const p=currentState.players[pid];
    const isMe=pid===myPlayerId;
    const isActive=currentState.auction?.activeBidderId===pid;
    badges.appendChild(el(`
      <div class="p-badge ${isActive?'active':''} ${isMe?'me':''}">
        <div class="p-name">${esc(p.name)}${isMe?' 👤':''}</div>
        <div class="p-bal">${p.balance} 🪙</div>
      </div>
    `));
  }
  app.appendChild(badges);

  switch(currentState.status){
    case 'waiting':      renderGameWaiting(); break;
    case 'auction':      renderAuction();     break;
    case 'round_result': renderRoundResult(); break;
    case 'collection':   renderCollection();  break;
    case 'battle':       renderBattle();      break;
    case 'final':        renderFinal();       break;
  }
}

      <div style="font-size:14px;color:#6b7080;margin-bottom:12px">Rakip bekleniyor…</div>
      <div class="lobby-code-box">
        <div class="lobby-code">${esc(myGameId||'…')}</div>
        <div class="lobby-hint">Bu kodu rakibine gönder</div>

      </div>
    </div>
  `);
  app.appendChild(card);
  card.querySelector('#btn-copy').addEventListener('click',()=>{navigator.clipboard?.writeText(myGameId||'').catch(()=>{});showToast('Kopyalandı!',true);});

function renderAuction(){
  const a=currentState.auction;
  const isMyTurn=a.activeBidderId===myPlayerId;
  const minBid=a.currentBid?a.currentBid.amount+1:1;
  const myBal=currentState.players[myPlayerId].balance;
  const rc=RARITY_COLORS[a.animalRarity]||'#888';

  const card=el(`
    <div class="card">
      <div class="animal-big">
        <div class="a-emoji">${a.animalEmoji}</div>
        <div class="a-name">${esc(a.animalName)} × ${a.quantity}</div>
        <div class="a-meta">Güç ${a.animalPower.basePower} · ATK ${a.animalPower.attack} · DEF ${a.animalPower.defense} · SPD ${a.animalPower.speed}</div>
        <span class="rarity-badge" style="background:${rc}22;color:${rc}">${a.animalRarity}</span>
      </div>
      <div class="bid-box">
        <div class="bid-amt">${a.currentBid?a.currentBid.amount+' 🪙':'İlk teklif'}</div>
        ${a.currentBid?`<div class="bid-who">${esc(currentState.players[a.currentBid.bidderId]?.name||'')}</div>`:''}
      </div>
      <div class="turn-box">${isMyTurn?'🎯 Sıra sende!':`⏳ ${esc(currentState.players[a.activeBidderId]?.name||'')} düşünüyor…`}</div>
      ${isMyTurn?`
        <div class="bid-row">
          <input type="number" id="bid-amt" min="${minBid}" max="${myBal}" value="${Math.min(Math.max(minBid,1),myBal)}" ${myBal<minBid?'disabled':''}>
          <button class="btn-primary" id="btn-bid" ${myBal<minBid?'disabled':''}>Teklif Ver</button>
        </div>
        <button class="btn-secondary" id="btn-pass" ${!a.currentBid?'disabled':''}>Pas Geç</button>
        ${!a.currentBid?'<p style="font-size:12px;color:#6b7080;margin-top:6px">İlk teklifi vermeden pas geçemezsin.</p>':''}
        ${myBal<minBid?'<p style="font-size:12px;color:#6b7080;margin-top:6px">Bakiyen yetersiz.</p>':''}
      `:`<div class="observer">Rakibin hamlesini bekle…</div>`}
    </div>
  `);
  app.appendChild(card);
  if(isMyTurn){
    card.querySelector('#btn-bid')?.addEventListener('click',()=>{
      const amt=parseInt(card.querySelector('#bid-amt').value,10);
      if(!amt||amt<minBid){showErr(`Min teklif ${minBid} 🪙`);return;}
      sendAction('PLACE_BID',{bidderId:myPlayerId,amount:amt});
    });
    card.querySelector('#btn-pass')?.addEventListener('click',()=>sendAction('PASS',{passerId:myPlayerId}));
    card.querySelector('#bid-amt')?.addEventListener('keydown',e=>{if(e.key==='Enter')card.querySelector('#btn-bid')?.click();});
  }
}

  const s1=b.scores.player1,s2=b.scores.player2;
  const win=s1===s2?null:(s1>s2?'player1':'player2');
  const iWon=win===myPlayerId;
  const xpGain=iWon?XP_WIN:XP_LOSE;

  const card=el(`

      <div id="stats-line" style="font-size:13px;color:#6b7080;margin-bottom:16px">İstatistikler güncelleniyor…</div>
    </div>
  `);
  app.appendChild(card);

  // Rövanş butonu
  const rematch=el(`<button class="rematch-btn" id="btn-rematch">🔥 RÖVANŞ</button>`);
  rematch.addEventListener('click',()=>{
    const oppName=currentState.players[win===myPlayerId?'player2':'player1']?.name||'?';

      disconnectWs();readyPlayers.clear();
      startGame(null);
    }
  });
  app.appendChild(rematch);
  app.appendChild(backMenuBtn('Ana Menüye Dön'));
}

// ── WebSocket & Oyun Başlatma ─────────────────────────────
function startGame(existingGameId){
  clearAutoTimer();readyPlayers.clear();
  forfeitResult=null;
  screen='game';currentState=null;myGameId=existingGameId;
  myPlayerId=null;reconnectAttempts=0;
  subScreen=null;
  connectWs(existingGameId);
}

function connectWs(existingGameId=null){
  clearTimeout(reconnectTimer);
  if(ws){ws.onclose=null;ws.close();ws=null;}
  connStatus=existingGameId?'reconnecting':'connecting';
  render();
  try{ws=new WebSocket(DEFAULT_WS);}catch{connStatus='disconnected';showErr('Geçersiz adres.');return;}
  ws.onopen=()=>{
    reconnectAttempts=0;
    const msg={type:'JOIN',playerName:profile.username,token:authToken};
    if(existingGameId)msg.gameId=existingGameId;
    // Private lobi: sunucuya otomatik başlatma flag'i ver
    if(lobbyMode==='waiting')msg.privateLobby=true;
    ws.send(JSON.stringify(msg));
  };
  ws.onmessage=(evt)=>{
    let msg;try{msg=JSON.parse(evt.data);}catch{return;}
    handleWsMsg(msg);
  };
  ws.onclose=()=>{
    connStatus='disconnected';
    if(myGameId&&currentState&&currentState.status!=='final'&&reconnectAttempts<MAX_RECONNECT){
      reconnectAttempts++;
      const delay=Math.min(1000*Math.pow(1.6,reconnectAttempts-1),20000);
      connStatus='reconnecting';render();
      reconnectTimer=setTimeout(()=>connectWs(myGameId),delay);
    }else{render();}
  };
}

async function handleWsMsg(msg){
  const prevStatus=currentState?.status;
  const prevPlayerId=myPlayerId;

  switch(msg.type){
    case 'CONNECTED':
      myPlayerId=msg.playerId;
      connStatus='connected';myGameId=msg.gameId;currentState=msg.state;
      // Lobi modunda slot güncelle + duel davet gönder
      if(lobbyMode==='waiting'){
        if(currentState.players?.player1?.name)
          lobbyPlayers['player1']={name:currentState.players.player1.name,ready:false};
        // Düello daveti kabul edilmişse: yeni lobi kuruldu, ORİJİNAL davetin
        // lobby_code alanını güncelle ki gönderen kişi kendi polling'inde
        // bu kodu görüp aynı odaya bağlansın.
        if(acceptedInviteId&&msg.gameId){
          sb.updateDuelInvite(authToken, acceptedInviteId, {lobby_code: msg.gameId})
            .then(()=>showToast('Rakibine haber verildi! 🗡️',true))
            .catch(()=>showToast('Rakibe haber verilemedi.',false));
          acceptedInviteId=null;
        }
      }
      break;
    case 'STATE_UPDATE':
      currentState=msg.state;connStatus='connected';
      // Lobi: ikinci oyuncu bağlandı → slotları güncelle
      if(lobbyMode==='waiting'){
        if(currentState.players?.player1?.name)
          lobbyPlayers['player1']={name:currentState.players.player1.name,ready:lobbyPlayers['player1']?.ready||false};
        if(currentState.players?.player2?.name)
          lobbyPlayers['player2']={name:currentState.players.player2.name,ready:lobbyPlayers['player2']?.ready||false};
        // Player2: eğer STATE_UPDATE LOBBY_READY event ise geri sayım başlat
        if(msg.event?.type==='LOBBY_COUNTDOWN_START'&&!isHost()){
          startCountdownSequence();
        }
      }
      break;
    case 'OPPONENT_DISCONNECTED':connStatus='opponent_gone';break;
    case 'ROOM_CLOSED':
      connStatus='disconnected';
      if(msg.reason!=='finished'){showErr(msg.reason==='timeout'?'Rakip geri dönmedi.':'Oda kapandı.');myGameId=null;}
      break;
    case 'ACTION_REJECTED':showErr(msg.error||'Hamle reddedildi.');break;
    case 'ERROR':showErr(msg.error||'Sunucu hatası.');break;
    case 'GAME_OVER_FORFEIT':
      // Rakip bağlantıyı kesti ve geri dönmedi
      forfeitResult=msg;
      break;
  }

  const newStatus=currentState?.status;

  // Lobi modunda: sadece lobi ekranını güncelle, countdown başlatma
  if(lobbyMode==='waiting'){
    // Sunucu START_PRIVATE_GAME'i kabul edip oyunu başlattıysa
    // state artık 'waiting' değil → lobiden oyun ekranına geç
    if(newStatus&&newStatus!=='waiting'){
      lobbyMode=null;subScreen=null;screen='game';
      // Lobi'ye göre ilk status değişimini işle
    } else {
      if(subScreen==='lobby')render();
      return;
    }
  }

  // Status değişimi veya ilk bağlantı (prevPlayerId yoktu, şimdi var)
  const statusChanged=newStatus!==prevStatus;
  const freshConnect=!prevPlayerId&&myPlayerId;

  if(statusChanged||freshConnect){
    clearAutoTimer();

    if(newStatus==='round_result'){
      // Host normal şartlarda 3sn'de tetikler. Host bağlantı sorunu/throttle
      // yüzünden tetikleyemezse (tab arka planda, kısa kopma vb.), diğer
      // istemci 1.5sn ek gecikmeyle yedek olarak devreye girer. Böylece
      // oyun tek bir istemciye bağımlı kalıp donmaz.
      const delay=isHost()?3000:4500;
      startCountdown(delay,()=>{
        if(currentState?.status==='round_result')sendAction('ADVANCE_ROUND');
      });
    }
    if(newStatus==='collection'){
      readyPlayers.clear();
      const delay=isHost()?10000:11500;
      startCountdown(delay,()=>{
        if(currentState?.status==='collection')sendAction('START_BATTLE');
      });
    }
    if(newStatus==='battle'&&!currentState.battle?.revealed){
      scheduleReveal();
    }
    if(newStatus==='final'){
      clearAutoTimer();
      if(authToken&&authUser){
        const b=currentState.battle;
        const win=b.scores.player1===b.scores.player2?null:(b.scores.player1>b.scores.player2?'player1':'player2');
        const iWon=win===myPlayerId;
        try{
          const result=await sb.updateStats(authToken,authUser.id,iWon,profile.mmr,1000);
          profile=await sb.getProfile(authToken);
          const sl=document.querySelector('#stats-line');
          if(sl&&result)sl.textContent=`+${result.xpGain} XP · MMR ${result.mmrChange>=0?'+':''}${result.mmrChange} · Toplam ${result.newXp} XP`;
          const matchRecord={
            room_id:myGameId||'unknown',
            player1_id:authUser.id,
            player2_id:authUser.id,
            winner_id:iWon?authUser.id:null,
            p1_score:myPlayerId==='player1'?b.scores.player1:b.scores.player2,
            p2_score:myPlayerId==='player1'?b.scores.player2:b.scores.player1,
            p1_mmr_change:result?.mmrChange||0,
            p2_mmr_change:-(result?.mmrChange||0),
          };
          await sb.saveMatch(authToken,matchRecord);
        }catch(e){console.error('Stats err:',e);}
      }
    }
  }

  // Battle: yeni karşılaşma başladı (revealed=false döndü) → countdown yenile
  if(newStatus==='battle'&&prevStatus==='battle'&&
     currentState?.battle?.revealed===false&&
     msg.type==='STATE_UPDATE'){
    scheduleReveal();
  }

  render();
}
function scheduleReveal(){
  // Host öncelikli tetikler; host devrede değilse diğer istemci yedek olarak
  // devreye girer, sunucu çift REVEAL_BATTLE isteğini normalde reddedeceği
  // için (zaten revealed=true) güvenli bir yedeklemedir.
  const delay=isHost()?4000:5500;
  startCountdown(delay,()=>{
    if(currentState?.status==='battle'&&!currentState.battle?.revealed)sendAction('REVEAL_BATTLE');
  });
}

function disconnectWs(){
  clearAutoTimer();clearTimeout(reconnectTimer);
  if(ws){ws.onclose=null;ws.close();ws=null;}
  connStatus='disconnected';currentState=null;myGameId=null;
}

function sendAction(type,payload={}){
  if(!ws||ws.readyState!==1){showErr('Bağlantı yok.');return;}
  ws.send(JSON.stringify({type:'ACTION',action:{type,payload}}));
}

// ── Countdown ─────────────────────────────────────────────
function clearAutoTimer(){
  clearTimeout(autoTimer);clearInterval(countdownTick);autoTimer=null;
}
function countdownPct(){
  if(!countdownEnd||!countdownTotal)return 100;
  return Math.max(0,Math.round(((countdownEnd-Date.now())/countdownTotal)*100));
}
function startCountdown(totalMs,onDone){
  clearAutoTimer();
  countdownEnd=Date.now()+totalMs;countdownTotal=totalMs;
  countdownTick=setInterval(()=>{
    const lbl=document.querySelector('#cd-lbl');
    const fill=document.querySelector('#cd-fill');
    if(lbl){
      const sec=Math.max(0,Math.ceil((countdownEnd-Date.now())/1000));
      if(currentState?.status==='round_result')lbl.textContent=`${sec}sn içinde devam ediyor…`;
      else if(currentState?.status==='collection')lbl.textContent=readyPlayers.has(myPlayerId)?'Rakip bekleniyor…':`Hazır ol! ${sec}sn`;
      else if(currentState?.status==='battle')lbl.textContent=`${sec}sn içinde savaşıyor…`;
    }
    if(fill)fill.style.width=countdownPct()+'%';
  },250);
  autoTimer=setTimeout(()=>{clearInterval(countdownTick);onDone();},totalMs);
}

function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showErr(msg){errorMsg=msg;successMsg=null;render();setTimeout(()=>{errorMsg=null;render();},3500);}
function showToast(msg,ok=false){if(ok){successMsg=msg;errorMsg=null;}else{errorMsg=msg;successMsg=null;}render();setTimeout(()=>{successMsg=null;errorMsg=null;render();},3000);}
function friendlyErr(msg){
  if(!msg)return'Bir hata oluştu.';
  if(msg.includes('already registered'))return'Bu e-posta zaten kayıtlı.';
  if(msg.includes('Invalid login'))return'E-posta veya şifre yanlış.';
  if(msg.includes('Password'))return'Şifre en az 6 karakter.';
  return msg;
}
function relativeTime(iso){
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60)return'Az önce';
  if(diff<3600)return Math.floor(diff/60)+' dk önce';
  if(diff<86400)return Math.floor(diff/3600)+' sa önce';
  return Math.floor(diff/86400)+' gün önce';
}

// ── Başlangıç ─────────────────────────────────────────────
async function loadProfile(){
  if(!authToken){screen='auth';render();return;}
  try{
    // 1. JWT'den authUser'ı al — getProfile buna bağımlı
    const parts=authToken.split('.');
    if(parts.length===3){
      const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
      authUser={id:payload.sub,email:payload.email};
    }
    if(!authUser?.id)throw new Error('Token geçersiz');

    // 2. Profili çek — trigger gecikmesi için 3 kez dene
    let tries=0;
    while(!profile && tries<3){
      profile=await sb.getProfile(authToken);
      if(!profile){ tries++; await new Promise(r=>setTimeout(r,800)); }
    }

    // 3. Hâlâ yoksa manuel oluştur (trigger çalışmamış olabilir)
    if(!profile){
      const username=authUser.email.split('@')[0].replace(/[^a-z0-9_]/gi,'').slice(0,20)||'oyuncu';
      await fetch(`${SUPABASE_URL}/rest/v1/profiles`,{
        method:'POST',
        headers:{
          'apikey':SUPABASE_ANON,
          'Authorization':`Bearer ${authToken}`,
          'Content-Type':'application/json',
          'Prefer':'return=minimal',
        },
        body:JSON.stringify({id:authUser.id,username})
      });
      profile=await sb.getProfile(authToken);
    }

    if(!profile)throw new Error('Profil oluşturulamadı');

    friends=await sb.getFriends(authToken);
    const notifs=await sb.getNotifications(authToken);
    unreadCount=notifs.filter(n=>!n.read).length;
    cachedNotifs=notifs;
    seenNotifIds=new Set(notifs.map(n=>n.id));   // mevcut bildirimler için toast basma
    screen='menu';render();
  }catch(e){
    console.error('loadProfile hata:',e);
    // Token süresi dolmuşsa sil, yoksa auth ekranına at ama token'ı koru
    if(e.message==='Token geçersiz'){
      authToken=null;localStorage.removeItem('vm_token');
    }
    screen='auth';render();
  }
}

screen='loading';render();
loadProfile();

// Bildirimleri otomatik/anlık düşürmek için periyodik yoklama (5sn)
setInterval(pollNotifications, 5000);

// Aktif düello davetini periyodik kontrol et
setInterval(async()=>{
  if(!authToken||!activeDuelInvite)return;
  try{
    const inv=await sb.getDuelInvite(authToken,activeDuelInvite.id);
    if(!inv)return;
    if(inv.status==='accepted'&&inv.lobby_code){
      // Kabul edildi → lobiye git
      activeDuelInvite=null;
      clearTimeout(duelWaitTimer);
      clearInterval(duelCountdown);
      subScreen='lobby'; lobbyMode='waiting';
      startLobby(inv.lobby_code);
    } else if(inv.status==='declined'){
      activeDuelInvite=null;
      clearTimeout(duelWaitTimer);
      clearInterval(duelCountdown);
      showToast(inv.receiver_name||'Rakip'+ ' düello davetini reddetti.',false);
      subScreen=null; render();
    } else if(inv.status==='expired'||inv.status==='cancelled'){
      activeDuelInvite=null;
      if(subScreen==='duel-wait'){subScreen=null;render();}
    }
  }catch{}
},3000);
